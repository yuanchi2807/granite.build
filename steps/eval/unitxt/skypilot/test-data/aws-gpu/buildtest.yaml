# YAML-driven spec for test_skypilot_aws_unitxt_gpu.py (located by the test/ <->
# test-data/ helper, so this pairing holds in both test modes; see steps/README.md).
#
# ONE target on skypilot/aws with one A10G: unitxt-evaluate in hf mode on GPU,
# against a bound hf:// model. See the sibling build.yaml for what SUCCESS proves.
targets:
  - evaluate
target_expectations:
  # step_count is 1: skypilot/aws sets `inline: true` on its hf assetstore pull, so
  # the model download runs inside the eval/unitxt step instead of as a separate
  # hfpull step, and the env:// output queues no push step (the same accounting as
  # dpk's aws-tok).
  - target_name: evaluate
    step_count: 1              # eval/unitxt (hf pull inline)
    input_artifact_count: 1    # model
    output_artifact_count: 1   # results (env://, registered inline from the marker)
    # Only keys the build.yaml supplied appear in the persisted step config
    # (step-template.yaml defaults are not merged in), so assert on those.
    expected_steps:
      - step_uri: space://steps/eval/unitxt
        config:
          unitxt_config:
            tasks: "card=cards.mmlu_pro.engineering"
            model_args: "torch_dtype=bfloat16,device=cuda"
# The Space this test resolves space://steps/eval/unitxt (and the environment +
# monitors) through. In the step dir (Mode 1) that is the local Space rendered by
# `make space`; `make publish-step` rewrites it to configurations/spaces/local.
space_uri: ../../space
# Happy-path run only, to keep it to ONE EC2 launch: the cancellation variant would
# provision a second instance.
tests:
  - runner
# No injected synthetic failure, for the same reason: `set -euo pipefail` already
# fails the target if the install or the CLI fails.
simulate_step_failure: false
# One EC2 job: provisioning, the inline model download (~6 GB), a CUDA torch +
# unitxt install, then a 10-instance GPU evaluation. Headroom for provisioning
# delays, while still bounding the cost of a hung run.
timeout_minutes: 60
